name: Prepare release

# Opens, or updates, the "chore: release" pull request with the pending changesets:
# version in package.json, CHANGELOG.md, `@since next` replaced. Merging it publishes (publish.yml).

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    # from another branch the action would open changeset-release/<branch> against it
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pending changesets
        run: |
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)" ]; then
            echo "::error::No pending changeset: nothing to release."
            exit 1
          fi
      # the release pull request is opened with GITHUB_TOKEN, so the CI does not run on it: check here
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run check:since
      - run: pnpm run build
      - run: pnpm run check:package
      - run: pnpm run test
      - uses: changesets/action@v2
        with:
          version-script: pnpm run release:version
          pr-title: 'chore: release'
          commit-message: 'chore: release'
