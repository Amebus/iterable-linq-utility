name: Npm Publish

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-test.yml

  publish-package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # required by npm trusted publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm publish

  deploy-doc:
    needs: publish-package
    permissions:
      contents: write
    uses: ./.github/workflows/publish_doc.yml
