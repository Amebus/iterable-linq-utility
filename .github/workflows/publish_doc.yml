name: Publish Doc

# release:  called by publish.yml with the release commit as `ref`, deploys the released minor and moves `latest`
# next:     every push to main that changes the docs or the sources, deploys `next`
# redeploy: manual, deploys the minor of `ref` (default: the last tag); moves `latest` only for the latest minor

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: release
      ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to redeploy (default the last tag)
        type: string
        default: ''
  push:
    branches:
      - main
    paths:
      - documentation/**
      - src/**

permissions:
  contents: write

jobs:
  deploy-doc:
    runs-on: ubuntu-latest
    # A group keeps one pending run, and a newer one replaces it: releases get their own group, so a queued
    # `next` cannot replace a release. Deployments of different groups can race on gh-pages: see deploy() below.
    concurrency:
      group: ${{ inputs.mode == 'release' && 'gh-pages-release' || 'gh-pages' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # a called workflow sees the event of its caller: the mode input wins
          if [ -n "$INPUT_MODE" ]; then
            mode="$INPUT_MODE"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode=redeploy
          else
            mode=next
          fi
          last_tag=$(git tag --sort=-v:refname | head -1)
          if [ "$mode" = redeploy ]; then
            ref="${INPUT_REF:-$last_tag}"
            # main or a commit would publish unreleased documentation over a released version
            if [ -z "$(git tag -l "$ref")" ] && [ "${ref#docs/}" = "$ref" ]; then
              echo "::error::ref must be a release tag or a docs/<minor> branch, not '$ref'"
              exit 1
            fi
            git checkout "$ref"
          elif [ -n "$INPUT_REF" ]; then
            git checkout "$INPUT_REF"
          fi
          {
            echo "mode=$mode"
            echo "doc_version=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
            echo "latest_version=$(echo "$last_tag" | cut -d. -f1-2)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}-${{ hashFiles('documentation/requirements.txt') }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r documentation/requirements.txt
      - name: Deploy doc
        working-directory: ./documentation
        run: |
          # starts every attempt from the remote gh-pages, so a push rejected by a concurrent deployment is retried
          deploy() {
            for attempt in 1 2 3; do
              git fetch origin gh-pages && git branch -f gh-pages origin/gh-pages && "$@" && return 0
              echo "Attempt $attempt failed, retrying" >&2
              sleep 10
            done
            return 1
          }
          case "$mode" in
            release)
              deploy mike deploy --push --update-aliases "$doc_version" latest
              deploy mike set-default --push latest
              ;;
            next)
              deploy mike deploy --push --title "next (unreleased)" next
              ;;
            redeploy)
              if [ "$doc_version" = "$latest_version" ]; then
                deploy mike deploy --push --update-aliases "$doc_version" latest
              else
                deploy mike deploy --push "$doc_version"
              fi
              ;;
            *)
              echo "Unknown mode: $mode" >&2
              exit 1
              ;;
          esac
