site_name: Iterable Linq Utility
repo_url: https://github.com/Amebus/iterable-linq-utility
repo_name: amebus/iterable-linq-utility
theme:
  icon:
    repo: simple/github
  name: material
  # the banner of the `next` version (overrides/main.html)
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tabs
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.tabs.link
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      # generated by scripts/next-doc.ts, not in git
      exclude:
        - upcoming.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: ⚓︎
  - tables
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      # the workflow runs mkdocs from documentation/, the preview from the root: CHANGELOG.md is found from both
      base_path: ['.', '..']
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
extra:
  version:
    provider: mike
    default: latest
  # the state of `next`, set by scripts/next-doc.ts when publish_doc.yml deploys it; empty otherwise: no banner
  next:
    state: !ENV [NEXT_STATE, '']
    version: !ENV [NEXT_VERSION, '']
    changes: !ENV [NEXT_CHANGES, '']
extra_css:
  - stylesheets/extra.css

nav:
  - Overview: 
    - index.md
    - Getting Started: getting-started.md
    - Basic Concepts: basic-concepts.md
    - Alternative Projects: alternative-projects.md
    - Migrating to 0.12.0: migrating-to-0.12.0.md
    - Migrating to 0.1.0: migrating-to-0.1.0.md
    - Changelog: changelog.md
    - How to contribute: how-to-contribute.md
    - Working with AI agents: ai-agents.md
  - Advanced Concepts: 
    - advanced-concepts/index.md
    - Interoperability with other libraries: advanced-concepts/interoperability-with-other-libraries.md
    - Extending the API: advanced-concepts/extending.md
  - Api Reference:
    - api-reference/index.md
    - Actions: api-reference/actions.md
    - Transformations: api-reference/transformations.md
    - Taps: api-reference/taps.md
  - Glossary: glossary.md